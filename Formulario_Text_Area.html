<!-- Encabezado con configuración principal -->

<!-- Cuerpo del documento -->
<body>
<h2>Formulario con text area</h2>
<!-- <form>: define el contenedor de los campos; action=: indica la ruta que va a procesar los datos; method="post": oculta la información enviada -->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<!-- Salto de línea -->
<br>
<br>
Ingresa tu correo:
<input type="email" name="correo">
<!-- Salto de línea -->
<br>
<br>
Ingresa tus comentarios:
<!-- "textarea" permite saltos de línea, "name" es el nombre de la variable, "rows" la altura inicial y "cols" el ancho -->
<textarea name="comentarios" rows="1" cols="10"></textarea><br>
 <!-- "submit" toma los datos y los envia al dar clic en el botón -->
<input type="submit" value="Enviar">
 <!-- "reset" limpia los campos llenados al dar clic en el botón -->
<input type="reset" value="Borrar">
<!-- Al presionar enviar los datos se enviarán al servidor -->
</form>
</body>
</html>
