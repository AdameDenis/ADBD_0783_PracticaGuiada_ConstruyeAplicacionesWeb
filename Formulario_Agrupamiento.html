<!-- Configuración de lenguaje -->
<html lang="es">
<!-- Encabezado con configuración principal -->
<head>
<meta charset="UTF-8">
<!-- Tamaño de la página -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">
<title>ADBD0783 Práctica 7_Formularios</title>
</head>

<!-- Cuerpo del documento -->
<body>
<h2>Formularios con agrupamiento</h2>
   <!-- <form>: define el contenedor de los campos; action=: indica la ruta que va a procesar los datos; method="post": oculta la información enviada -->
<form action="" method="post">

<!-- Crea un recuadro alrededor de los campos para organizar -->
<fieldset>
<!-- Es la leyenda/título de la sección -->
<legend>Datos personales</legend>
Nombre y apellido:
<input type="text" name="nombre_apellido"><br>
Documento valido:
<!-- Dato de tipo archivo -->
<input type="file" name="documento"><br>
Fecha de nacimiento:
<input type="date" name="fecha_nacimiento">
</fieldset>

<!-- Crea un recuadro alrededor de los campos para organizar -->
<fieldset>
<!-- Es la leyenda/título de la sección -->
<legend>Datos de estudio:</legend>
Nombre de la escuela:
<input type="text" name="escuela"><br>
Certificado valido:
<!-- Dato de tipo archivo -->
<input type="file" name="certificado"><br>
Fecha de egreso:
<!-- Dato de tipo fecha -->
<input type="date" name="fecha_egreso">
</fieldset>
<br>
 <!-- Botón: "submit" toma los datos y los envia al dar clic en el botón, además se añade el ícono de avión de papel -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
 <!-- Botón: "reset" limpia los campos llenados al dar clic en el botón, además se añade el ícono de bote de basura -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
 <!-- form enviará al servidor los datos -->
</form>
</body>
</html>
