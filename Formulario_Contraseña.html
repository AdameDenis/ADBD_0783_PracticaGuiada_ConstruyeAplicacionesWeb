<body>
    <h2>Formulario para contraseñas</h2>
   <!-- <form>: define el contenedor de los campos; action=: indica la ruta que va a procesar los datos; method="post": oculta la información enviada -->
 <form action="" method="post">

 Ingresa tu usuario:
 <input type="text" name="usuario">
 Ingresa tu contraseña:
 <!-- <input type="text">: es el tipo de dato a recibir name="pass" es el nombre de la variable -->
 <input type="password" name="pass"> <br>
 <!-- "submit" toma los datos y los envia al dar clic en el botón -->
 <input type="submit" value="Enviar">
 <!-- "reset" limpia los campos llenados al dar clic en el botón -->
 <input type="reset" value="Borrar">
 <!-- form enviará al servidor los datos -->
 </form>
</body>
