<h2>Formularios con checkbox</h2>
<!-- <form>: define el contenedor de los campos; action=: indica la ruta que va a procesar los datos; method="post": oculta la información enviada -->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<!-- Salto de línea -->
<br>
Selecciona los lenguajes que conozcas:
<br>
<!-- "checkbox" permite marcar opciones, "name" es el nombre de la variable y al final se encuentra la opción -->
<input type="checkbox" name="Java">Java<br>
<!-- "checkbox" permite marcar opciones, "name" es el nombre de la variable y al final se encuentra la opción -->
<input type="checkbox" name="Python"> Python <br>
<!-- "checkbox" permite marcar opciones, "name" es el nombre de la variable y al final se encuentra la opción -->
<input type="checkbox" name="C#">C# <br>
<!-- "checkbox" permite marcar opciones, "name" es el nombre de la variable y al final se encuentra la opción -->
<input type="checkbox" name="Flutter"> Flutter <br>
 <!-- form enviará al servidor los datos -->
</form>
</body>
