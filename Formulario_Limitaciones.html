<body>
<h2>Formulario con limitaciones</h2>
<!-- <form>: define el contenedor de los campos; action=: indica la ruta que va a procesar los datos; method="post": oculta la información enviada -->
<form action="" method="post">
Ingresa tu nombre:
<!-- Desahbilitacion de campo -->
<input type="text" name="nombre" disabled><br>
<!-- Limitación de caracteres -->
Contraseña:
<input type="password" name="pass" maxlength="5"><br>

<!-- Solo lectura -->
Comentarios:
<textarea name="comentarios" readonly>
Este es mi comentario y no se puede borrar
</textarea><br>
<!-- form enviará al servidor los datos -->
</form>
</body>
