<!-- Cuerpo del documento -->
<body>
<h2>Formularios con seleccion</h2>
   <!-- <form>: define el contenedor de los campos; action=: indica la ruta que va a procesar los datos; method="post": oculta la información enviada -->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">

<br>
Selecciona tu pais:
<!-- Select muestra un listado de opciones en el que se elige solo una -->
<select name="pais">
<option value="1">Argentina</option> <!--Opción -->
<option value="2">España</option> <!--Opción -->
<option value="3">Mexico</option> <!--Opción -->
<option value="4">Guatemala</option> <!--Opción -->
<option value="5">Honduras</option> <!--Opción -->
<option value="6">El Salvador</option> <!--Opción -->
<option value="7">Venezuela</option> <!--Opción -->
<option value="8">Colombia</option> <!--Opción -->
</select>
<br>
 <input type="submit" value="Enviar">
 <!-- "reset" limpia los campos llenados al dar clic en el botón -->
 <input type="reset" value="Borrar">
 <!-- form enviará al servidor los datos -->
</form>
</body>
</html>
